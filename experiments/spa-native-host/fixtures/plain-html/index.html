<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plain HTML · Native actions</title><script src="/platform-sdk.js"></script><style>body{max-width:640px;margin:40px auto;padding:0 24px;background:#f7f7f2;color:#182924;font:16px/1.6 Arial,sans-serif}h1{font:42px/1.1 Georgia,serif}button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:8px;background:#235a46;color:white;margin:5px 5px 5px 0}textarea{display:block;width:100%;box-sizing:border-box;min-height:130px;margin:20px 0;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:#e9eee3;border-radius:8px}small{color:#65716b}</style></head><body><a href="/">← Application</a><p><small>FRAMEWORK-INDEPENDENT FIXTURE</small></p><h1>Ordinary HTML.<br>Native actions.</h1><p>This document uses the same injected SDK, without React, Next.js, or Stimulus.</p><p id="connection" role="status">Connecting…</p><button id="haptic">Light impact</button><button id="sheet">Native sheet</button><button id="camera">Take photo</button><label for="draft">A plain HTML draft</label><textarea id="draft"></textarea><button id="save">Save draft</button><button id="read">Read draft</button><button id="remove">Remove draft</button><pre id="result" role="status">No action yet.</pre><img id="preview" alt="Captured photo" hidden style="max-width:100%"><script>
const status = document.querySelector('#connection');
const result = document.querySelector('#result');
function storage() { if (!platform.storage) throw new platform.PlatformError('UNSUPPORTED', 'Native storage is unavailable in this app.'); return platform.storage; }
async function run(operation) { try { const value = await operation(); result.textContent = JSON.stringify({ok:true,result:value},null,2); } catch(error) { result.textContent = JSON.stringify({ok:false,code:error.code,message:error.message},null,2); } }
platform.ready().then(value => {status.textContent = 'Connected to ' + value.platform; if (!platform.storage || !['storage.get','storage.set','storage.remove'].every(action => value.capabilities.includes(action))) { for (const id of ['save','read','remove']) document.getElementById(id).disabled = true; result.textContent = 'Native storage is unavailable in this app.'; } return platform.navigation.update({path:'/',title:'Plain HTML',canGoBack:false});}, error => {status.textContent = error.code + ': ' + error.message;});
document.querySelector('#haptic').onclick = () => run(() => platform.haptics.impact({style:'light'}));
document.querySelector('#sheet').onclick = () => run(() => platform.navigation.present({screen:'native-demo'}));
document.querySelector('#save').onclick = () => run(() => storage().set('plain-draft',document.querySelector('#draft').value));
document.querySelector('#read').onclick = () => run(async () => {const value = await storage().get('plain-draft'); document.querySelector('#draft').value = value || ''; return value;});
document.querySelector('#remove').onclick = () => run(() => storage().remove('plain-draft'));
document.querySelector('#camera').onclick = () => run(async () => {const photo = await platform.camera.capture(); const image = document.querySelector('#preview'); image.src = await platform.files.previewURL(photo.file); image.hidden = false; return photo;});
</script></body></html>
